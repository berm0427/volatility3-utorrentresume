name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Volatility 3
        run: python -m pip install volatility3==2.28.2
      - name: Compile plugin
        run: python -m py_compile utorrentresume.py
      - name: Run tests
        run: python -m unittest -v test_utorrentresume.py test_mock_integration.py
